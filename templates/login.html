{% extends "base.html" %}

{% block title%}
    Login Page
{% endblock %}

{% block content %}
<form action="/login" method="get">
        <div>
            <label>Name</label>
            <input type="text" name="uname">
        </div>

        <div>
            <label>Password</label>
            <input type="password" name="pass">
        </div>

        <button type="submit">Submit</button>

    </form>
{% endblock %}
